name: Render Remotion Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render Video
        run: npm run render

      - name: Upload Video Result
        uses: actions/upload-artifact@v4
        with:
          name: umroh-video-result
          path: out/
